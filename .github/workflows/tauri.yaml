name: publish

on:
  workflow_dispatch:
  push:
    branches:
      - release
      - main

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------
  # Linux
  # Builds the ELF on Ubuntu 22.04 for broader glibc compatibility.
  # Also publishes Tauri's normal Linux bundles.
  # ------------------------------------------------------------
  publish-linux:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/release' ||
      (
        github.ref == 'refs/heads/main' &&
        contains(github.event.head_commit.message, 'Test build')
      )

    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish Linux bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: Killdozer v__VERSION__
          releaseBody: Macfags can cry because LinuxGQDs and WindowsChads get the Dozerpill.
          releaseDraft: false
          prerelease: false

      # Save the already-built ELF for makepkg.
      # This is an Actions artifact, NOT a GitHub Release asset.
      - name: Upload Linux ELF for Arch packaging
        uses: actions/upload-artifact@v4
        with:
          name: killdozer-linux-elf
          path: src-tauri/target/release/killdozer
          if-no-files-found: error
          retention-days: 1

  # ------------------------------------------------------------
  # Windows
  # Runs in parallel with Linux.
  # ------------------------------------------------------------
