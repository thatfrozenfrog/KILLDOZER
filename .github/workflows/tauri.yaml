name: publish

on:
  workflow_dispatch:
  push:
    branches:
      - release
      - main

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================
  # Linux
  #
  # Builds on Ubuntu 22.04 for an older glibc baseline.
  # Tauri creates the normal Linux bundles (.deb/.rpm/AppImage).
  # The raw ELF is then passed to the Arch packaging job.
  # ============================================================
  publish-linux:
    name: Linux

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/release' ||
      (
        github.ref == 'refs/heads/main' &&
        contains(github.event.head_commit.message, 'Test build')
      )

    permissions:
      contents: write

    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm + Node
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@24
          cache: true
          install: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish Linux bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: Killdozer v__VERSION__
          releaseBody: See the assets below to download this version.
          releaseDraft: false
          prerelease: false

      - name: Prepare Arch package
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./package.json').version")"
          sed -i \
            "s/^pkgver=.*/pkgver=${VERSION//-/_}/" \
            packaging/arch/PKGBUILD

          cp src-tauri/target/release/killdozer packaging/arch/killdozer
          cp src-tauri/icons/128x128.png packaging/arch/killdozer.png
          chmod +x packaging/arch/killdozer

          test -x packaging/arch/killdozer
          test -f packaging/arch/killdozer.desktop
          test -f packaging/arch/killdozer.png
          test -f packaging/arch/PKGBUILD

      - name: Build Arch package
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            -v "$GITHUB_WORKSPACE/packaging/arch:/build" \
            archlinux:latest \
            bash -euxo pipefail -c '
              pacman -Syu --noconfirm
              pacman -S --needed --noconfirm base-devel

              if ! id builder >/dev/null 2>&1; then
                useradd --create-home builder
              fi

              chown -R builder:builder /build

              runuser -u builder -- bash -c "
                cd /build
                makepkg --noconfirm --force --nodeps
              "
            '

      - name: Verify Arch package
        shell: bash
        run: |
          set -euo pipefail

          ls -lh packaging/arch/*.pkg.tar.zst

          PACKAGE="$(find packaging/arch \
            -maxdepth 1 \
            -name 'killdozer-[0-9]*.pkg.tar.zst' \
            -print \
            -quit)"

          test -n "$PACKAGE"

          tar -tf "$PACKAGE" | grep -F 'usr/bin/killdozer'
          tar -tf "$PACKAGE" | grep -F 'usr/share/applications/killdozer.desktop'
          tar -tf "$PACKAGE" | grep -F 'usr/share/icons/hicolor/128x128/apps/killdozer.png'

      - name: Upload Arch package
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./package.json').version")"

          gh release upload \
            "app-v${VERSION}" \
            packaging/arch/killdozer-[0-9]*.pkg.tar.zst \
            --clobber \
            --repo "$GITHUB_REPOSITORY"


  # ============================================================
  # Windows
  #
  # Runs independently/in parallel with Linux.
  # ============================================================
  publish-windows:
    name: Windows

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/release' ||
      (
        github.ref == 'refs/heads/main' &&
        contains(github.event.head_commit.message, 'Test build')
      )

    permissions:
      contents: write

    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm + Node
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@24
          cache: true
          install: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish Windows bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: Killdozer v__VERSION__
          releaseBody: See the assets below to download this version.
          releaseDraft: false
          prerelease: false
