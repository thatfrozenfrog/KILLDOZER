name: publish

on:
  workflow_dispatch:
  push:
    branches:
      - release
      - main

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-tauri:
    permissions:
      contents: write

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/release' ||
      (
        github.ref == 'refs/heads/main' &&
        contains(github.event.head_commit.message, 'Test build')
      )

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''

          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm + Node
        uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@24
          cache: true
          install: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Tauri dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish Tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: Killdozer v__VERSION__
          releaseBody: CHANGE THIS
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  publish-arch:
    name: Arch Linux package

    needs: publish-tauri

    permissions:
      contents: write

    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Arch build dependencies
        run: |
          pacman -Syu --noconfirm

          pacman -S --needed --noconfirm \
            base-devel \
            nodejs \
            pnpm \
            rust \
            webkit2gtk-4.1 \
            openssl \
            appmenu-gtk-module \
            libappindicator-gtk3 \
            librsvg \
            xdotool \
            github-cli

      - name: Create build user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Install frontend dependencies
        run: |
          runuser -u builder -- bash -lc "
            cd '$GITHUB_WORKSPACE'
            pnpm install --frozen-lockfile
          "

      - name: Build Tauri binary
        run: |
          runuser -u builder -- bash -lc "
            cd '$GITHUB_WORKSPACE'
            pnpm tauri build --no-bundle
          "

      - name: Prepare Arch package
        run: |
          runuser -u builder -- bash -lc "
            cd '$GITHUB_WORKSPACE'

            VERSION=\$(node -p \"require('./package.json').version\")

            sed -i \
              \"s/^pkgver=.*/pkgver=\$VERSION/\" \
              packaging/arch/PKGBUILD

            cp \
              src-tauri/target/release/killdozer \
              packaging/arch/killdozer

            cp \
              src-tauri/icons/128x128.png \
              packaging/arch/killdozer.png
          "

      - name: Build Arch package
        run: |
          runuser -u builder -- bash -lc "
            cd '$GITHUB_WORKSPACE/packaging/arch'
            makepkg --noconfirm --force
          "

      - name: Upload Arch package to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"

          gh release upload \
            "app-v${VERSION}" \
            packaging/arch/*.pkg.tar.zst \
            --clobber