name: publish

on:
  workflow_dispatch:
  push:
    branches:
      - release
      - main

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================
  # Linux
  #
  # Builds on Ubuntu 22.04 for an older glibc baseline.
  # Tauri creates the normal Linux bundles (.deb/.rpm/AppImage).
  # The raw ELF is then passed to the Arch packaging job.
  # ============================================================
  publish-linux:
    name: Linux

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/release' ||
      (
        github.ref == 'refs/heads/main' &&
        contains(github.event.head_commit.message, 'Test build')
      )

    permissions:
      contents: write

    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm + Node
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@24
          cache: true
          install: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish Linux bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: Killdozer v__VERSION__
          releaseBody: See the assets below to download this version.
          releaseDraft: false
          prerelease: false

      # ----------------------------------------------------------
      # Build an Actions artifact containing everything makepkg
      # needs, while preserving the same directory structure that
      # your current PKGBUILD expects.
      # ----------------------------------------------------------
      - name: Prepare Arch packaging payload
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./package.json').version")"
          PKGVER="${VERSION//-/_}"

          echo "Application version: $VERSION"
          echo "Arch pkgver:        $PKGVER"

          test -s src-tauri/target/release/killdozer
          test -f src-tauri/icons/128x128.png
          test -f packaging/arch/PKGBUILD
          test -f packaging/arch/killdozer.desktop

          mkdir -p \
            arch-payload/src-tauri/target/release \
            arch-payload/src-tauri/icons \
            arch-payload/packaging/arch

          cp \
            src-tauri/target/release/killdozer \
            arch-payload/src-tauri/target/release/killdozer

          cp \
            src-tauri/icons/128x128.png \
            arch-payload/src-tauri/icons/128x128.png

          cp \
            packaging/arch/killdozer.desktop \
            arch-payload/packaging/arch/killdozer.desktop

          cp \
            packaging/arch/PKGBUILD \
            arch-payload/packaging/arch/PKGBUILD

          # Keep PKGBUILD version synchronized with package.json.
          sed -i \
            "s/^pkgver=.*/pkgver=${PKGVER}/" \
            arch-payload/packaging/arch/PKGBUILD

          # Keep the original semver for the GitHub release tag.
          printf '%s\n' "$VERSION" > arch-payload/version.txt

      - name: Upload Arch packaging payload
        uses: actions/upload-artifact@v7
        with:
          name: killdozer-arch-payload
          path: arch-payload/
          if-no-files-found: error
          retention-days: 1


  # ============================================================
  # Windows
  #
  # Runs independently/in parallel with Linux.
  # ============================================================
  publish-windows:
    name: Windows

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/release' ||
      (
        github.ref == 'refs/heads/main' &&
        contains(github.event.head_commit.message, 'Test build')
      )

    permissions:
      contents: write

    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm + Node
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@24
          cache: true
          install: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish Windows bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: Killdozer v__VERSION__
          releaseBody: See the assets below to download this version.
          releaseDraft: false
          prerelease: false


  # ============================================================
  # Arch Linux
  #
  # DOES NOT:
  #   - checkout git
  #   - install Node
  #   - install pnpm
  #   - install Rust
  #   - compile Tauri
  #
  # It only packages the Ubuntu-built ELF.
  # ============================================================
  publish-arch:
    name: Arch Linux package

    needs:
      - publish-linux

    permissions:
      contents: write

    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      - name: Update Arch container
        run: pacman -Syu --noconfirm

      - name: Install packaging tools
        run: |
          pacman -S --needed --noconfirm \
            base-devel \
            github-cli

      - name: Download Ubuntu-built payload
        uses: actions/download-artifact@v8
        with:
          name: killdozer-arch-payload
          path: .

      - name: Validate payload
        shell: bash
        run: |
          set -euo pipefail

          test -s src-tauri/target/release/killdozer
          test -f src-tauri/icons/128x128.png
          test -f packaging/arch/PKGBUILD
          test -f packaging/arch/killdozer.desktop
          test -s version.txt

          chmod +x src-tauri/target/release/killdozer

          echo "Release version: $(cat version.txt)"
          echo
          echo "PKGBUILD:"
          grep -E '^(pkgname|pkgver|pkgrel|arch)=' \
            packaging/arch/PKGBUILD

      - name: Create makepkg user
        run: |
          useradd --create-home builder

          chown -R \
            builder:builder \
            "$GITHUB_WORKSPACE/packaging/arch"

      - name: Build Arch package
        shell: bash
        run: |
          set -euo pipefail

          runuser -u builder -- bash -lc "
            set -euo pipefail
            cd '$GITHUB_WORKSPACE/packaging/arch'

            makepkg \
              --noconfirm \
              --force \
              --nodeps
          "

      - name: Verify Arch package
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          packages=(packaging/arch/*.pkg.tar.zst)

          if (( ${#packages[@]} == 0 )); then
            echo "::error::makepkg did not produce a .pkg.tar.zst"
            exit 1
          fi

          printf 'Produced package(s):\n'
          printf '  %s\n' "${packages[@]}"

          # Verify the important installed files exist in the package.
          bsdtar -tf "${packages[0]}" \
            | grep -q 'usr/bin/killdozer'

          bsdtar -tf "${packages[0]}" \
            | grep -q 'usr/share/applications/killdozer.desktop'

          bsdtar -tf "${packages[0]}" \
            | grep -q 'usr/share/icons/hicolor/128x128/apps/killdozer.png'

      - name: Upload Arch package to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          VERSION="$(cat version.txt)"

          shopt -s nullglob
          packages=(packaging/arch/*.pkg.tar.zst)

          gh release upload \
            "app-v${VERSION}" \
            "${packages[@]}" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"