  #     - name: Install Rust
  #       uses: dtolnay/rust-toolchain@stable

  #     - name: Cache Rust
  #       uses: swatinem/rust-cache@v2
  #       with:
  #         workspaces: src-tauri -> target

  #     - name: Install frontend dependencies
  #       run: pnpm install --frozen-lockfile

  #     - name: Build and publish Windows bundles
  #       uses: tauri-apps/tauri-action@v1
  #       env:
  #         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  #       with:
  #         tagName: app-v__VERSION__
  #         releaseName: Killdozer v__VERSION__
  #         releaseBody: Macfags can cry because LinuxGQDs and WindowsChads get the Dozerpill.
  #         releaseDraft: false
  #         prerelease: false

  # ------------------------------------------------------------
  # Arch
  # Does NOT rebuild Tauri.
  # Only downloads Ubuntu-built ELF and runs makepkg.
  # ------------------------------------------------------------
  publish-arch:
    name: Arch Linux package

    needs:
      - publish-linux

    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Arch packaging tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            git \
            base-devel \
            nodejs \
            github-cli

      - name: Download Linux ELF
        uses: actions/download-artifact@v4
        with:
          name: killdozer-linux-elf
          path: packaging/arch

      - name: Prepare package
        run: |
          VERSION="$(node -p "require('./package.json').version")"

          sed -i \
            "s/^pkgver=.*/pkgver=$VERSION/" \
            packaging/arch/PKGBUILD

          cp \
            src-tauri/icons/128x128.png \
            packaging/arch/killdozer.png

          chmod +x packaging/arch/killdozer

      - name: Build Arch package
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

          runuser -u builder -- bash -lc "
            cd '$GITHUB_WORKSPACE/packaging/arch'
            makepkg --noconfirm --force
          "

      - name: Upload Arch package to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"

          gh release upload \
            "app-v${VERSION}" \
            packaging/arch/*.pkg.tar.zst \
            --clobber