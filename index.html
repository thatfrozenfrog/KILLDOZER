<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="UTF-8" />
    <title>Killdozer</title>
    <link rel="stylesheet" href="/src/css/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <header id="app-bar">
      <div id="app-title" data-window-drag-region>KILLDOZER</div>
      <span class="spacer" data-window-drag-region></span>
      <div class="scheme-control">
        <button id="scheme-picker" class="bar-control" type="button" title="Base24 color scheme" aria-label="Color scheme" aria-haspopup="listbox" aria-expanded="false"></button>
        <div id="scheme-menu" class="scheme-menu hidden" role="listbox" aria-label="Base24 color scheme"></div>
      </div>
      <button id="toggle-connection" class="bar-btn" title="Connection drawer">Connection</button>
      <button id="toggle-cheats" class="bar-btn" title="Cheats drawer">Cheats</button>
      <div id="window-controls" aria-label="Window controls">
        <button class="window-control" data-window-action="minimize" type="button" aria-label="Minimize" title="Minimize">−</button>
        <button class="window-control" data-window-action="maximize" type="button" aria-label="Maximize" title="Maximize">□</button>
        <button class="window-control close" data-window-action="close" type="button" aria-label="Close" title="Close">×</button>
      </div>
    </header>

    <nav id="tab-bar" aria-label="Session tabs"></nav>

    <main id="workspace"></main>

    <aside id="connection-drawer" class="drawer left" aria-label="Connection">
      <div class="drawer-title">SSH Connection</div>
      <div class="drawer-target">telehack.com:2222</div>
      <form id="connection-form" class="connection-form" onsubmit="return false">
        <label class="form-label">
          <span class="form-label-text">Username</span>
          <input type="text" id="username" value="guest" autocomplete="off" />
        </label>

        <label class="form-label">
          <span class="form-label-text">Proxy IP (optional)</span>
          <input type="text" id="proxy-ip" placeholder="e.g., 127.0.0.1" autocomplete="off" />
        </label>

        <label class="form-label">
          <span class="form-label-text">Proxy Port (optional)</span>
          <input type="text" id="proxy-port" placeholder="e.g., 9050" autocomplete="off" />
        </label>

        <label class="form-label checkbox-label">
          <input type="checkbox" id="proxy-auth-enabled" />
          <span class="form-label-text">Authentication?</span>
        </label>

        <div id="proxy-auth-fields" class="proxy-auth-fields hidden">
          <label class="form-label">
            <span class="form-label-text">Proxy username</span>
            <input type="text" id="proxy-username" placeholder="Proxy username" autocomplete="off" />
          </label>

          <label class="form-label">
            <span class="form-label-text">Proxy password</span>
            <input type="password" id="proxy-password" placeholder="Proxy password" autocomplete="off" />
          </label>
          <p class="plaintext-note">Proxy password is stored in plaintext in local storage.</p>
        </div>

        <button type="button" id="connect-btn">Connect</button>
        <button type="button" id="disconnect-btn" class="danger" disabled>Disconnect</button>
      </form>

      <div class="statusbar" id="status">
        <hr />
        <span id="status-text">Disconnected</span>
      </div>
    </aside>

    <aside id="cheats-drawer" class="drawer right" aria-label="Cheats">
      <div id="cheats-drawer-resize" class="cheats-drawer-resize" role="separator" aria-orientation="vertical" aria-label="Resize cheats drawer" tabindex="0" title="Drag to resize"></div>
      <div class="cheats-drawer-scroll">
        <div id="cheat-header">
          <input type="search" id="search" placeholder="Search cheats" autocomplete="off" aria-label="Search cheats" />
          <div class="dropdown-control">
            <button id="cheat-category-filter" class="filter-btn" type="button" aria-label="Cheat category" aria-haspopup="listbox" aria-expanded="false">All categories</button>
            <div id="cheat-category-menu" class="dropdown-menu hidden" role="listbox" aria-label="Cheat category"></div>
          </div>
          <div class="dropdown-control">
            <button id="cheat-status-filter" class="filter-btn" type="button" aria-label="Cheat status" aria-haspopup="listbox" aria-expanded="false">All states</button>
            <div id="cheat-status-menu" class="dropdown-menu hidden" role="listbox" aria-label="Cheat status"></div>
          </div>
          <span id="active-count"></span>
        </div>
        <div id="cheat-list"></div>
      </div>
    </aside>

    <div id="window-resize-handles" aria-hidden="true">
      <div class="window-resize-handle north" data-resize-direction="North"></div>
      <div class="window-resize-handle south" data-resize-direction="South"></div>
      <div class="window-resize-handle east" data-resize-direction="East"></div>
      <div class="window-resize-handle west" data-resize-direction="West"></div>
      <div class="window-resize-handle north-west" data-resize-direction="NorthWest"></div>
      <div class="window-resize-handle north-east" data-resize-direction="NorthEast"></div>
      <div class="window-resize-handle south-west" data-resize-direction="SouthWest"></div>
      <div class="window-resize-handle south-east" data-resize-direction="SouthEast"></div>
    </div>

    <div id="pane-menu" class="hidden" role="menu"></div>
  </body>
</html>
